# sst1mpipe-train-disp-reconstructor: models of sst1mpipe_mc_config_low_nsb.yaml (RF settings, features, cuts)
# needs the telescope frame parameters (hillas_fov_lon / lat, hillas_psi): sst1mpipe-process ...
# --ImageProcessor.use_telescope_frame=True
#   sst1mpipe-train-disp-reconstructor -i gamma_diffuse_train.dl1.h5 -o disp_reconstructor.pkl \
#     --config sst1mpipe_train_disp_reconstructor.yaml --n-events 700000 --cv-output cv_disp.h5
#
# Every configurable value of the components used is written (explicit, no reliance on the
# defaults); the input and output files are given on the command line.

TrainDispReconstructor:  # ``ctapipe-train-disp-reconstructor`` with plots: feature importances, disp norm, sign accuracy
  random_seed: 42  # Random seed for sampling training events
  chunk_size: 100000  # How many subarray events to load at once before training on n_events
  n_events: [[type, '*', null]]  # Number of events for training the models
  n_jobs: null  # Number of threads to use for the reconstruction
  overwrite: false
  project_disp: false  # If true, ``true_disp`` is the distance between shower cog and the true source position along the reconstruc...

Application: {}  # A singleton application with full configuration support

DispReconstructor:  # Predict absolute value and sign for disp origin reconstruction and convert to altitude and azimuth predicti...
  norm_cls: RandomForestRegressor  # Which scikit-learn regression model to use
  norm_config:  # random_forest_regressor_args
    n_estimators: 150
    max_depth: 30
    min_samples_leaf: 10
    min_samples_split: 10
    bootstrap: true
    criterion: squared_error
    random_state: 42
  sign_cls: RandomForestClassifier  # Which scikit-learn classification model to use
  sign_config:  # random_forest_classifier_args
    n_estimators: 100
    max_depth: 100  # classifier: SST-1M Crab paper (Sec. 4.3.3)
    min_samples_leaf: 10
    min_samples_split: 10
    bootstrap: true
    criterion: gini
    random_state: 42
  # the same features for the norm and the sign (sst1mpipe: disp_regression_features for the norm,
  # disp_classification_features for the sign); no position in the camera (as sst1mpipe)
  features:  # Features to use for both models
    - log_hillas_intensity
    - hillas_width
    - hillas_length
    - hillas_wl
    - hillas_skewness
    - hillas_kurtosis
    - timing_slope
    - leakage_intensity_width_2
    - cos_zenith  # pointing of the telescope (models of all the zenith angles)
  # mono models: one telescope, the direction of its disp (the stereo combination does nothing)
  stereo_combiner_cls: StereoMeanCombiner  # Which stereo combination method to use
  log_target: false  # If True, the norm(disp) model is trained to predict ln(norm(disp)) and the output is ``prefix_parameter`` =...
  n_jobs: null  # Number of threads to use for the reconstruction if supported by the reconstructor
  prefix: disp  # Prefix for the output of this model

# stereo models: add HillasReconstructor_tel_impact_distance and HillasReconstructor_h_max
FeatureGenerator:  # Generate features for astropy.table.Table
  features:  # List of 2-Tuples of Strings: ('new_feature_name', 'expression to generate feature')
    - [log_hillas_intensity, log10(hillas_intensity)]
    - [hillas_wl, hillas_width / hillas_length]
    - [cos_zenith, sin(telescope_pointing_altitude)]

MLQualityQuery:  # Quality criteria for machine learning models with different defaults
  quality_criteria:  # list of tuples of ('<description', 'expression string') to accept (select) a given data value
    - [intensity, (hillas_intensity > 45) & (hillas_intensity < 1e6)]
    - [width, hillas_width > 0]
    - [length, hillas_length > 0]
    - [leakage, leakage_intensity_width_2 < 0.7]

StereoMeanCombiner:  # Calculate array-event prediction as (weighted) mean of telescope-wise predictions
  weights: intensity  # What kind of weights to use
  log_target: false  # If true, calculate exp(mean(log(values)))
  prefix: disp  # Prefix to be added to the output container / column names
  property: GEOMETRY  # Which property is being combined

TableLoader:  # Load telescope-event or subarray-event data from ctapipe HDF5 files
  dl1_images: false  # load extracted images
  dl1_muons: false  # load muon ring parameters
  dl1_parameters: true  # load reconstructed image parameters
  dl2: true  # load available dl2 stereo parameters
  focal_length_choice: EFFECTIVE  # If both nominal and effective focal lengths are available, which one to use for the `~ctapipe.coordinates.C...
  instrument: false  # join subarray instrument information to each event
  observation_info: false  # join observation information to each event
  pointing: true  # Load pointing information and interpolate / join to events
  simulated: true  # load simulated shower information
  true_images: false  # load simulated shower images
  true_parameters: true  # load image parameters obtained from true images

PointingInterpolator:  # Interpolator for pointing and pointing correction data
  bounds_error: true  # If true, raises an exception when trying to extrapolate out of the given table
  extrapolate: false  # If bounds_error is False, this flag will specify whether values outsidethe available values are filled with...

CrossValidator:  # Class to train sklearn based reconstructors in a cross validation
  n_cross_validations: 5  # Number of cross validation iterations
  rng_seed: 1337  # Random seed for splitting the training data
