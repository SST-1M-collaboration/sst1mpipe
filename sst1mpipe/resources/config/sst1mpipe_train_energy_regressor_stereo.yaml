# sst1mpipe-train-energy-regressor: stereo models (SST-1M Crab paper, arXiv:2506.01733): the features of the
# mono models (sst1mpipe_train_energy_regressor.yaml) and the stereo parameters of the HillasReconstructor
# (impact distance of the telescope, height of the shower maximum), trained on the events reconstructed
# by both telescopes; applied to the stereo events (sst1mpipe-stereo reconstructs their geometry)
TrainEnergyRegressor:
  random_seed: 42
  EnergyRegressor:
    model_cls: RandomForestRegressor
    model_config:              # random_forest_regressor_args
      n_estimators: 150
      max_depth: 30
      min_samples_leaf: 10
      min_samples_split: 10
      bootstrap: true
      criterion: squared_error
      random_state: 42
    log_target: true           # sst1mpipe: log10(true_energy), ctapipe: ln(true_energy)
    features:                  # energy_regression_features (telescope frame names)
      - log_hillas_intensity
      - hillas_width
      - hillas_length
      - hillas_wl
      - hillas_skewness
      - hillas_kurtosis
      - timing_slope
      - leakage_intensity_width_2
      - hillas_fov_lon         # camera_frame_hillas_x
      - hillas_fov_lat         # camera_frame_hillas_y
      - cos_zenith             # pointing of the telescope (models of all the zenith angles)
      - HillasReconstructor_tel_impact_distance
      - HillasReconstructor_h_max
    FeatureGenerator:          # sst1mpipe.utils.add_features
      features:
        - ["log_hillas_intensity", "log10(hillas_intensity)"]
        - ["hillas_wl", "hillas_width / hillas_length"]
        - ["cos_zenith", "sin(telescope_pointing_altitude)"]
    MLQualityQuery:
      quality_criteria:
        # cuts of the SST-1M Crab paper (arXiv:2506.01733): intensity > 45 p.e., leakage2 < 0.7
        - ["intensity", "(hillas_intensity > 45) & (hillas_intensity < 1e6)"]
        - ["width", "hillas_width > 0"]
        - ["length", "hillas_length > 0"]
        - ["leakage", "leakage_intensity_width_2 < 0.7"]
        # stereo parameters of the HillasReconstructor (both telescopes)
        - ["stereo", "np.isfinite(HillasReconstructor_h_max) & np.isfinite(HillasReconstructor_tel_impact_distance)"]
    StereoMeanCombiner:
      weights: intensity       # stereo_reco_weights: hillas intensity
