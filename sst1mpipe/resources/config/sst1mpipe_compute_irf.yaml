# ==============================================================================
# ctapipe-compute-irf config file for SST-1M (sst1mpipe-apply-models DL2: disp geometry)
#
# Configuration for calculating IRF with or without applying a spatial selection
# ==============================================================================

IrfTool:
  # with the sst1mpipe tools: CRAB_HEGRA is the Crab of MAGIC (--crab MAGIC, default), IRFDOC_PROTON_SPECTRUM
  # the protons + helium of DAMPE (--background p_he, default), see sst1mpipe.performance.irf_tools
  gamma_target_spectrum: CRAB_HEGRA
  proton_target_spectrum: IRFDOC_PROTON_SPECTRUM
  electron_target_spectrum: IRFDOC_ELECTRON_SPECTRUM
  obs_time: 50 hour
  energy_dispersion_maker_name: "EnergyDispersion2dMaker"
  effective_area_maker_name: "EffectiveArea2dMaker"
  psf_maker_name: "PSF3DMaker"
  background_maker_name: "BackgroundRate2dMaker"
  angular_resolution_maker_name: "AngularResolution2dMaker"
  energy_bias_resolution_maker_name: "EnergyBiasResolution2dMaker"
  # Sensitivity2dMaker of ctapipe and the minimum statistics of the simulations (sst1mpipe.performance.irf_tools)
  sensitivity_maker_name: "MinimumStatisticsSensitivity2dMaker"

DL2EventPreprocessor:
  energy_reconstructor: "RandomForestRegressor"
  geometry_reconstructor: "disp"
  gammaness_classifier: "RandomForestClassifier"

  DL2EventQualityQuery:
    quality_criteria:
      - ["valid classifier", "RandomForestClassifier_is_valid"]
      - ["valid geom reco", "disp_is_valid"]
      - ["valid energy reco", "RandomForestRegressor_is_valid"]


# Using the following three components, default values for the reconstruced/true energy
# and fov bins can be configured for all irf components and benchmarks.
# These values are used, if the corresponding configuration options are not overwritten
# in the configuration of the individual components/benchmarks themselves.

DefaultRecoEnergyBins:
  reco_energy_min: 0.1 TeV
  reco_energy_max: 1000 TeV
  reco_energy_n_bins_per_decade: 5

DefaultTrueEnergyBins:
  true_energy_min: 0.1 TeV
  true_energy_max: 1000 TeV
  true_energy_n_bins_per_decade: 10

DefaultFoVOffsetBins:
  fov_offset_min: 0 deg
  fov_offset_max: 5 deg
  fov_offset_n_bins: 3

EnergyDispersion2dMaker:
  # true_energy_min: 0.1 TeV
  # true_energy_max: 1000 TeV
  # true_energy_n_bins_per_decade: 10
  energy_migration_min: 0.2
  energy_migration_max: 5
  energy_migration_n_bins: 30
  # fov_offset_min: 0 deg
  # fov_offset_max: 5 deg
  # fov_offset_n_bins: 3

PSF3DMaker:
  # true_energy_min: 0.1 TeV
  # true_energy_max: 1000 TeV
  # true_energy_n_bins_per_decade: 10
  source_offset_min: 0.0 deg
  source_offset_max: 1.0 deg
  source_offset_n_bins: 100
  # fov_offset_min: 0 deg
  # fov_offset_max: 5 deg
  # fov_offset_n_bins: 3

# EffectiveArea2dMaker:
#   true_energy_min: 0.1 TeV
#   true_energy_max: 1000 TeV
#   true_energy_n_bins_per_decade: 10
#   fov_offset_min: 0 deg
#   fov_offset_max: 5 deg
#   fov_offset_n_bins: 3

# BackgroundRate2dMaker:
#   reco_energy_min: 0.1 TeV
#   reco_energy_max: 1000 TeV
#   reco_energy_n_bins_per_decade: 5
#   fov_offset_min: 0 deg
#   fov_offset_max: 5 deg
#   fov_offset_n_bins: 3

AngularResolution2dMaker:
  use_reco_energy: False
  quantiles: [0.25, 0.5, 0.68, 0.95]
  # reco_energy_min: 0.1 TeV
  # reco_energy_max: 1000 TeV
  # reco_energy_n_bins_per_decade: 5
  # true_energy_min: 0.1 TeV
  # true_energy_max: 1000 TeV
  # true_energy_n_bins_per_decade: 10
  # fov_offset_min: 0 deg
  # fov_offset_max: 5 deg
  # fov_offset_n_bins: 3

# EnergyBiasResolution2dMaker:
#   true_energy_min: 0.1 TeV
#   true_energy_max: 1000 TeV
#   true_energy_n_bins_per_decade: 10
#   fov_offset_min: 0 deg
#   fov_offset_max: 5 deg
#   fov_offset_n_bins: 3

Sensitivity2dMaker:
  alpha: 0.2
  # reco_energy_min: 0.1 TeV
  # reco_energy_max: 1000 TeV
  # reco_energy_n_bins_per_decade: 5
  # background of the sensitivity: the gamma-like protons within 1.2 deg of the camera center (the on-axis
  # point source), as sst1mpipe < 0.9 (theta_cut_p) and the SST-1M Crab paper, scaled to the size of the ON
  # region; the background around the source, not the average over the field of view (0-5 deg: lower, as
  # the acceptance decreases with the offset). Only for the sensitivity: the IRFs keep DefaultFoVOffsetBins.
  fov_offset_min: 0 deg
  fov_offset_max: 1.2 deg
  fov_offset_n_bins: 1

# sensitivity of an energy bin only with more than 10 simulated gammas (ON region) and 10 simulated protons
# (background region) left after the cuts, as sst1mpipe < 0.9; NaN otherwise
MinimumStatisticsSensitivity2dMaker:
  min_simulated_signal: 10
  min_simulated_background: 10
