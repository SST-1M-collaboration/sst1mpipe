# Overlay of sst1mpipe_optimize_cuts.yaml, with sst1mpipe-optimize-event-selection: the fixed cuts of the
# SST-1M Crab paper (arXiv:2506.01733, Sec. 5.3) instead of the optimized ones: 60 % of the gammas kept
# by the gammaness cut in each energy bin, and one theta cut for all the energies keeping 80 % of the
# gammas (GlobalThetaPercentileCuts of sst1mpipe.performance.irf_tools)

EventSelectionOptimizer:
  optimization_algorithm: "GlobalThetaPercentileCuts"

GhPercentileCutCalculator:
  target_percentile: 60   # gamma efficiency of the gammaness cut

ThetaPercentileCutCalculator:
  target_percentile: 80   # containment of the theta cut (all the energies)
