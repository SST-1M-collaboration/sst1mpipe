# sst1mpipe-train-disp-reconstructor: stereo models (SST-1M Crab paper, arXiv:2506.01733): the features of the
# mono models (sst1mpipe_train_disp_reconstructor.yaml) and the stereo parameters of the HillasReconstructor
# (impact distance of the telescope, height of the shower maximum), trained on the events reconstructed
# by both telescopes; applied to the stereo events (sst1mpipe-stereo reconstructs their geometry)
TrainDispReconstructor:
  random_seed: 42
  DispReconstructor:
    norm_cls: RandomForestRegressor
    norm_config:               # random_forest_regressor_args
      n_estimators: 150
      max_depth: 30
      min_samples_leaf: 10
      min_samples_split: 10
      bootstrap: true
      criterion: squared_error
      random_state: 42
    sign_cls: RandomForestClassifier
    sign_config:               # random_forest_classifier_args
      n_estimators: 100
      max_depth: 100          # classifier: SST-1M Crab paper (Sec. 4.3.3)
      min_samples_leaf: 10
      min_samples_split: 10
      bootstrap: true
      criterion: gini
      random_state: 42
    # the same features for the norm and the sign (sst1mpipe: disp_regression_features for the norm,
    # disp_classification_features for the sign); no position in the camera (as sst1mpipe)
    features:
      - log_hillas_intensity
      - hillas_width
      - hillas_length
      - hillas_wl
      - hillas_skewness
      - hillas_kurtosis
      - timing_slope
      - leakage_intensity_width_2
      - cos_zenith             # pointing of the telescope (models of all the zenith angles)
      - HillasReconstructor_tel_impact_distance
      - HillasReconstructor_h_max
    FeatureGenerator:
      features:
        - ["log_hillas_intensity", "log10(hillas_intensity)"]
        - ["hillas_wl", "hillas_width / hillas_length"]
        - ["cos_zenith", "sin(telescope_pointing_altitude)"]
    MLQualityQuery:
      quality_criteria:
        # cuts of the SST-1M Crab paper (arXiv:2506.01733): intensity > 45 p.e., leakage2 < 0.7
        - ["intensity", "(hillas_intensity > 45) & (hillas_intensity < 1e6)"]
        - ["width", "hillas_width > 0"]
        - ["length", "hillas_length > 0"]
        - ["leakage", "leakage_intensity_width_2 < 0.7"]
        # stereo parameters of the HillasReconstructor (both telescopes)
        - ["stereo", "np.isfinite(HillasReconstructor_h_max) & np.isfinite(HillasReconstructor_tel_impact_distance)"]
    # stereo direction: intensity weighted mean of the directions of the telescopes
    stereo_combiner_cls: StereoMeanCombiner
    StereoMeanCombiner:
      weights: intensity
