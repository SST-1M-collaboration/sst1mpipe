name: release

# Build the package and publish it on PyPI when a version tag (v*) is pushed,
# e.g. `git tag v0.32.0a1 && git push origin v0.32.0a1`.
# The tag must be the version of pyproject.toml, with a leading "v".
# Uploads use the PyPI trusted publishing (no token): the GitHub environments "testpypi"
# and "pypi" must be declared as trusted publishers of the sst1mpipe project on
# test.pypi.org and pypi.org.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # build and check only, without publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # the test data (Git LFS) are not in the package
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag is the version of the package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not the version v${version} of pyproject.toml"
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
          ls -l dist/

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sst1mpipe
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish on TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sst1mpipe
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
