# Overlay of sst1mpipe_optimize_cuts.yaml / sst1mpipe_compute_irf.yaml for the comparison with the
# SST-1M Crab paper (arXiv:2506.01733, Sect. 5.3): fixed cuts (60 % of the gammas kept by the
# gammaness cut, 80 % by the theta cut), stereo events only (both telescopes in the three
# reconstructions)

EventSelectionOptimizer:
  optimization_algorithm: "PercentileCuts"

GhPercentileCutCalculator:
  target_percentile: 60   # gamma efficiency of the gammaness cut

ThetaPercentileCutCalculator:
  target_percentile: 80   # containment of the theta cut

DL2EventPreprocessor:
  DL2EventQualityQuery:
    quality_criteria:
      - ["valid classifier", "RandomForestClassifier_is_valid"]
      - ["valid geom reco", "disp_is_valid"]
      - ["valid energy reco", "RandomForestRegressor_is_valid"]
      - ["stereo geom reco", "np.count_nonzero(disp_telescopes, axis=1) >= 2"]
      - ["stereo energy reco", "np.count_nonzero(RandomForestRegressor_telescopes, axis=1) >= 2"]
      - ["stereo classifier", "np.count_nonzero(RandomForestClassifier_telescopes, axis=1) >= 2"]
