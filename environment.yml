name: sst1m-dev
channels:
  - conda-forge
  - default
dependencies:
  - python==3.11
  - pip
  - coverage
  - ctapipe==0.22.0 # first version with NSBImageCleaner
  - click
  - gammapy==1.3 # required for compatibilities with astropy
  - h5py
  - jupyter
  - protozfits # used to read zfits files and protocolbuffer messages
  - astroquery=0.4.6
  - matplotlib
  - numpy<2 # astropy 6.1 fails to import with numpy 2.4 (np.in1d removed)
  - nbmake # used to pytest jupyter notebooks
  - pytables
  - pytest
  - ruff
  - setuptools
  - scikit-learn
  - scipy
  - sphinx
  - sphinx-automodapi
  - sphinx-argparse
  - sphinx-design
  - sphinx_rtd_theme
  - sphinx-togglebutton
  - sphinxcontrib-mermaid
  - nbsphinx
  - numpydoc
  - vitables # to visualize hdf5 tables
  - wheel
  - pip:
      - ctaplot~=0.6.2
      - pyirf~=0.8.0
      - cts @ git+https://github.com/SST-1M-collaboration/CTS.git
