name: sst1m-dev
channels:
  - conda-forge
  - default
dependencies:
  - python==3.12
  - pip
  - coverage
  - ctapipe==0.32.0
  - eventio # optional dependency of ctapipe, used to read the simtel files
  - click
  - h5py
  - jupyter
  - protozfits # used to read zfits files and protocolbuffer messages
  - astroquery>=0.4.6
  - matplotlib
  - astropy>=7 # required by pyirf 0.14
  - ctaplot~=0.6.2
  - pyirf~=0.14.0 # version of ctapipe[all]: IRF tools of ctapipe (ctapipe-compute-irf)
  - nbmake # used to pytest jupyter notebooks
  - pandas
  - pytables
  - pytest
  - ruff
  - setuptools
  - scikit-learn
  - scipy
  - sphinx
  - sphinx-automodapi
  - sphinx-argparse
  - sphinx-design
  - sphinx_rtd_theme
  - sphinx-togglebutton
  - sphinxcontrib-mermaid
  - nbsphinx
  - pandoc # used by nbsphinx to convert the markdown cells of the notebooks
  - numpydoc
  - vitables # to visualize hdf5 tables
  - wheel
  - wrapt
  - iminuit
  - pyzmq
  - msgpack-python
  - pip:
      # not on conda-forge; sst1mpipe itself: pip install --no-deps -e . (the dependencies from conda)
      - sst1m-cts>=1.0 # sst1m_cts_core: camera configuration of DigiCam
      # gammapy > 2.1 (pyproject.toml): only the release candidate 2.2rc1 exists, on PyPI only.
      # TODO: once gammapy 2.2 is on conda-forge, move it to the conda dependencies as gammapy>2.1
      - gammapy>=2.2rc1
