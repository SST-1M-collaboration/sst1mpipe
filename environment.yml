name: sst1m-dev
channels:
  - conda-forge
  - default
dependencies:
  - python>=3.10
  - pip
  - coverage
  - ctapipe=0.17.0
  - click
  - gammapy>=1.0
  - h5py
  - jupyter
  - jupyterlab=3.5.2
  - protozfits
  - astroquery=0.4.6
  - matplotlib<=3.8
  - pydantic<2.0
  - pytables=3.8.0
  - pytest
  - ruff
  - setuptools<81 # required for ctapipe 0.17
  - scikit-learn=1.2.2
  - seaborn=0.13.0
  - sphinx
  - sphinx-automodapi
  - sphinx-argparse
  - sphinx-design
  - sphinx_rtd_theme
  - sphinx-togglebutton
  - sphinxcontrib-mermaid
  - nbsphinx
  - numpydoc
  - wheel
  - pip:
      - ctaplot~=0.6.2
      - pyirf~=0.8.0
      - git+https://github.com/SST-1M-collaboration/CTS.git
