[build-system]
requires = ["setuptools >= 64", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "sst1mpipe"
# The versions follow the ctapipe versions: sst1mpipe 0.32.x uses ctapipe 0.32.
# Alpha releases (0.32.0aN) until the DL1 to DL3 steps and the stereo matching use the new
# ctapipe tools.
version = "0.32.0a1"
description = "Analysis chain for the SST-1M prototype"
authors = [
  { name = "SST-1M collaboration" }
  ]
license = { file = "LICENSE" }
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "ctapipe[eventio]~=0.32.0",
  "astropy>=6.1,<7",  # astropy.coordinates.get_moon is removed in astropy 7 (sst1mpipe_obsplan)
  "numpy<2",  # astropy 6.1 fails to import with numpy 2.4 (np.in1d removed)
  "astroquery~=0.4.6",
  "click",
  "ctaplot~=0.6.2",
  "gammapy~=1.3.0",
  "h5py",
  "iminuit",
  "joblib",
  "matplotlib",
  "msgpack",  # headers of the messages of the stream of the processed events (zmq_event_stream)
  "pandas",
  "pillow",
  "protozfits",
  "pyirf~=0.8.0",
  "pyzmq",
  "scikit-learn",
  "scipy",
  "sst1m-cts>=1.0",  # sst1m_cts_core: camera configuration of DigiCam
  "tables",
  "tqdm",
  "traitlets",
  "wrapt",
]

[project.optional-dependencies]
tests = [
  "coverage",
  "nbmake",
  "pytest",
]
docs = [
  "nbsphinx",
  "numpydoc",
  "sphinx",
  "sphinx-argparse",
  "sphinx-automodapi",
  "sphinx-design",
  "sphinx-rtd-theme",
  "sphinx-togglebutton",
  "sphinxcontrib-mermaid",
]
dev = [
  "sst1mpipe[tests,docs]",
  "build",
  "ruff",
  "twine",
]


[project.urls]
Homepage = "https://sst-1m.space/"
Repository = "https://github.com/SST-1M-collaboration/sst1mpipe"
Documentation = "https://sst1mpipe.readthedocs.io/"

[metadata]


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["."]
include = ["sst1mpipe*"]
exclude = ["sst1mpipe.resources.test_data*"]

# The test data (resources/test_data, ~550 MB of Git LFS files) are not in the package:
# the tests run from the git repository (see also MANIFEST.in for the sdist).
[tool.setuptools.package-data]
sst1mpipe = [
  "resources/config/*",
  "resources/calibration/*",
  "resources/calibration/window/*",
  "resources/calibration/dark_runs/*",
  "resources/instrument/*",
]

[tool.setuptools.exclude-package-data]
sst1mpipe = ["resources/test_data/**"]

[project.scripts]
sst1mpipe_dl1_dl2 = "sst1mpipe.scripts.sst1mpipe_dl1_dl2:main"
sst1mpipe_data_dl1_dl1_stereo = "sst1mpipe.scripts.sst1mpipe_data_dl1_dl1_stereo:main"
sst1mpipe_data_get_photon_list = "sst1mpipe.scripts.sst1mpipe_data_get_photon_list:main"
sst1mpipe_data_dl2_dl3 = "sst1mpipe.scripts.sst1mpipe_data_dl2_dl3:main"
sst1mpipe_mc_performance = "sst1mpipe.scripts.sst1mpipe_mc_performance:main"
sst1mpipe_mc_make_irfs = "sst1mpipe.scripts.sst1mpipe_mc_make_irfs:main"
sst1mpipe_mc_train_rfs = "sst1mpipe.scripts.sst1mpipe_mc_train_rfs:main"
sst1mpipe_merge_hdf5 = "sst1mpipe.scripts.sst1mpipe_merge_hdf5:main"
sst1mpipe_pointing_check = "sst1mpipe.scripts.sst1mpipe_pointing_check:main"
rate_scans_extraction = "sst1mpipe.scripts.rate_scans_extraction:main"
create_hdu_indexes = "sst1mpipe.scripts.create_hdu_indexes:main"
sst1mpipe_extract_dl1_distributions = "sst1mpipe.scripts.sst1mpipe_extract_dl1_distributions:main"
sst1mpipe_night_summary = "sst1mpipe.scripts.sst1mpipe_night_summary:main"
sst1mpipe_obsplan = "sst1mpipe.scripts.sst1mpipe_obsplan:main"
sst1mpipe_mc_train_rfs_misdirection = "sst1mpipe.scripts.sst1mpipe_mc_train_rfs_misdirection:main"
sst1mpipe_event_classes = "sst1mpipe.scripts.sst1mpipe_event_classes:main"
sst1mpipe_read_camera_server_logs = "sst1mpipe.scripts.read_camera_server_logs:main"
sst1mpipe-process = "sst1mpipe.scripts.sst1mpipe_process_tool:main"
sst1mpipe-trigger = "sst1mpipe.scripts.sst1mpipe_trigger_tool:main"
sst1mpipe-monitoring = "sst1mpipe.scripts.sst1mpipe_monitoring_tool:main"
sst1mpipe-nsb = "sst1mpipe.scripts.sst1mpipe_nsb_tool:main"

# EventSource implementations found by ctapipe.io.EventSource
[project.entry-points.ctapipe_io]
SST1MEventSource = "sst1mpipe.io.sst1m_event_source:SST1MEventSource"

# MonitoringSource implementations found by ctapipe.io.MonitoringSource
[project.entry-points.ctapipe_monitoring]
SST1MMonitoringSource = "sst1mpipe.io.monitoring_source:SST1MMonitoringSource"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W"]
extend-select = ["B", "RET505", "RET507", "PIE808", "UP015", "UP032", "RUF037", "SIM910"]
ignore = ["E501"]
per-file-ignores = { "**/__init__.py" = ["F401"] }

[tool.pytest]
addopts = ["-vv", "-s", "--nbmake"]
testpaths = ['tests/', 'notebooks/sst1m_raw_r0_r1.ipynb', 'notebooks/sst1m_read_zfits_event_source.ipynb',
             'notebooks/sst1m_trigger_traces.ipynb']

[tool.coverage.run]
branch = true
command_line = "-m pytest"
source = ["sst1mpipe/"]

[tool.coverage.report]
fail_under = 25
show_missing = true
sort = "Cover"

[tool.coverage.xml]
output = "coverage.xml"

